<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
  @if (data.details.length > 0) {
    <ul>
      @for (detail of data.details; track detail) {
        <li>{{ detail }}</li>
      }
    </ul>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">Go back</button>
  <button mat-flat-button type="button" [mat-dialog-close]="true">{{ data.confirmLabel }}</button>
</mat-dialog-actions>
