<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
  <form id="prompt-form" (submit)="$event.preventDefault(); confirm()">
    <mat-form-field class="wide">
      <mat-label>{{ data.label }}</mat-label>
      <textarea matInput rows="3" [formControl]="answer"></textarea>
      <mat-error>{{ answer.errors | errorMessage }}</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancel</button>
  <button mat-flat-button type="submit" form="prompt-form">{{ data.confirmLabel }}</button>
</mat-dialog-actions>
