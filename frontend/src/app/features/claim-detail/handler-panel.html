<section class="card pad" aria-labelledby="handler-title">
  <h2 id="handler-title">Handler</h2>
  <p class="current">
    <span class="muted">Assigned to</span>
    <strong>{{ currentName() }}</strong>
  </p>
  <mat-form-field class="wide">
    <mat-label>Assign to</mat-label>
    <mat-select [formControl]="handler">
      @for (user of handlers(); track user.id) {
        <mat-option [value]="user.id">{{ user.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <button mat-flat-button type="button" [disabled]="!canAssign()" (click)="assign()">Assign</button>
</section>
