name: Deployment

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build and Test run to deploy (a push to main). Empty means the latest successful one.
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: deployment-demo
  cancel-in-progress: false

jobs:
  select:
    name: Select the build to deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
      head_sha: ${{ steps.select.outputs.head_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID_INPUT: ${{ inputs.run_id }}
    steps:
      - name: Select a successful build of main
        id: select
        run: |
          set -euo pipefail
          run_id="$RUN_ID_INPUT"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --workflow build-and-test.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::No usable run id. Push a commit to main and wait for Build and Test to pass, or give a run number."
            exit 1
          fi

          details=$(gh run view "$run_id" --json workflowName,event,headBranch,conclusion,headSha)
          if ! jq -e '.workflowName == "Build and Test" and .event == "push" and .headBranch == "main" and .conclusion == "success"' <<< "$details" > /dev/null; then
            echo "::error::Run $run_id must be a successful Build and Test run of a push to main."
            exit 1
          fi

          names=$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.expired | not) | .name] | sort | join(",")')
          if [ "$names" != "api,database" ]; then
            echo "::error::The artifacts of run $run_id are missing or expired (found: $names). Push a commit to main to build again."
            exit 1
          fi

          head_sha=$(jq -r .headSha <<< "$details")
          main_sha=$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)
          if [ "$head_sha" != "$main_sha" ]; then
            echo "::warning::Deploying ${head_sha}, which is not the latest commit on main (${main_sha})."
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Deploying commit ${head_sha} from Build and Test run ${run_id}." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Provision, migrate, deploy and smoke test
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: demo
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      SQL_ADMIN_OBJECT_ID: ${{ vars.SQL_ADMIN_OBJECT_ID }}
      SQL_ADMIN_LOGIN: ${{ vars.SQL_ADMIN_LOGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: api
          path: artifacts/api
          run-id: ${{ needs.select.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: database
          path: artifacts/database
          run-id: ${{ needs.select.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision infrastructure
        run: |
          az account get-access-token --resource https://database.windows.net/ --query expiresOn -o tsv > /dev/null
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "deployment-${GITHUB_RUN_ID}" \
            --parameters infra/demo.bicepparam \
            --query properties.outputs \
            --output json)
          jq -r 'to_entries[] | "\(.key)=\(.value.value)"' <<< "$outputs" >> "$GITHUB_ENV"
          server=$(jq -r .sqlServerFqdn.value <<< "$outputs")
          database=$(jq -r .databaseName.value <<< "$outputs")
          echo "SQL_CONNECTION=Server=tcp:${server},1433;Initial Catalog=${database};Authentication=Active Directory Default;Encrypt=True;" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: |
          chmod +x artifacts/database/efbundle
          for attempt in 1 2 3 4 5 6; do
            if artifacts/database/efbundle --connection "$SQL_CONNECTION"; then
              exit 0
            fi
            sleep 30
          done
          exit 1

      - name: Create the web app database user
        uses: azure/sql-action@eb1f9a80487ca52b90f41a473f53da4943526994
        with:
          connection-string: ${{ env.SQL_CONNECTION }}
          path: infra/sql/grant-app-user.sql
          arguments: -v UserName="${{ env.identityName }}" UserClientId="${{ env.identityClientId }}"

      - name: Verify the web app database user
        uses: azure/sql-action@eb1f9a80487ca52b90f41a473f53da4943526994
        with:
          connection-string: ${{ env.SQL_CONNECTION }}
          path: infra/sql/verify-app-user.sql
          arguments: -v UserName="${{ env.identityName }}"

      - name: Deploy the API
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383
        with:
          app-name: ${{ env.webAppName }}
          package: artifacts/api

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend against the deployed API
        working-directory: frontend
        run: |
          sed -i "s#apiBaseUrl: '/api'#apiBaseUrl: 'https://${webAppHostName}/api'#" src/environments/environment.ts
          grep -q "https://${webAppHostName}/api" src/environments/environment.ts
          npm ci
          npm run build

      - name: Read the static web app deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list --name "$staticWebAppName" --resource-group "$RESOURCE_GROUP" \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy the frontend
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/dist/claims-frontend/browser
          skip_app_build: true
          skip_api_build: true

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo "- App: https://${staticWebAppHostName}"
            echo "- API: https://${webAppHostName}"
            echo "- Swagger: https://${webAppHostName}/swagger"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        run: |
          api="https://${webAppHostName}"
          for attempt in $(seq 1 30); do
            curl -fsS -o /dev/null --max-time 20 "$api/health/ready" && break
            sleep 10
          done
          curl -fsS -o /dev/null --max-time 20 "$api/health/ready"

          user_id=$(az webapp config appsettings list --resource-group "$RESOURCE_GROUP" --name "$webAppName" \
            --query "[?name=='DevAuth__Users__0__Id'].value | [0]" --output tsv)
          token=$(curl -sS --fail-with-body --max-time 20 -X POST "$api/api/dev/token" \
            -H 'Content-Type: application/json' \
            -d "{\"userId\":\"${user_id}\"}" | jq -er .token)
          curl -fsS -o /dev/null --max-time 20 -H "Authorization: Bearer ${token}" "$api/api/claims"
