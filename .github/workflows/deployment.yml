name: Deployment

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build and Test run to deploy (a push to main). Empty means the latest successful one.
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: deployment-demo
  cancel-in-progress: false

jobs:
  select:
    name: Select the build to deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
      head_sha: ${{ steps.select.outputs.head_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID_INPUT: ${{ inputs.run_id }}
    steps:
      - name: Select a successful build of main
        id: select
        run: |
          set -euo pipefail
          run_id="$RUN_ID_INPUT"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --workflow build-and-test.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -z "$run_id" ]; then
            echo "::error::No successful Build and Test run of a push to main exists. Push a commit to main and wait for it to pass."
            exit 1
          fi
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::The run id must be a number."
            exit 1
          fi

          details=$(gh run view "$run_id" --json workflowName,event,headBranch,conclusion,headSha)
          if [ "$(jq -r .workflowName <<< "$details")" != "Build and Test" ]; then
            echo "::error::Run $run_id is not a Build and Test run."
            exit 1
          fi
          if [ "$(jq -r .event <<< "$details")" != "push" ] || [ "$(jq -r .headBranch <<< "$details")" != "main" ]; then
            echo "::error::Run $run_id is not a push to main. Only builds of reviewed code on main can be deployed."
            exit 1
          fi
          if [ "$(jq -r .conclusion <<< "$details")" != "success" ]; then
            echo "::error::Run $run_id did not succeed."
            exit 1
          fi

          names=$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.expired | not) | .name] | sort | join(",")')
          if [ "$names" != "api,database" ]; then
            echo "::error::The artifacts of run $run_id are missing or expired (found: $names). Push a commit to main to build again."
            exit 1
          fi

          head_sha=$(jq -r .headSha <<< "$details")
          main_sha=$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)
          if [ "$head_sha" != "$main_sha" ]; then
            echo "::warning::Deploying ${head_sha}, which is not the latest commit on main (${main_sha})."
          fi

          {
            echo "run_id=$run_id"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying commit ${head_sha} from Build and Test run ${run_id}." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Provision, migrate, deploy and smoke test
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: demo
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      SQL_ADMIN_OBJECT_ID: ${{ vars.SQL_ADMIN_OBJECT_ID }}
      SQL_ADMIN_LOGIN: ${{ vars.SQL_ADMIN_LOGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: api
          path: artifacts/api
          run-id: ${{ needs.select.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: database
          path: artifacts/database
          run-id: ${{ needs.select.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision infrastructure
        id: provision
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "deployment-${GITHUB_RUN_ID}" \
            --parameters infra/demo.bicepparam \
            --query properties.outputs \
            --output json)
          {
            echo "web_app_name=$(jq -r .webAppName.value <<< "$outputs")"
            echo "web_app_host=$(jq -r .webAppHostName.value <<< "$outputs")"
            echo "sql_server_fqdn=$(jq -r .sqlServerFqdn.value <<< "$outputs")"
            echo "database_name=$(jq -r .databaseName.value <<< "$outputs")"
            echo "identity_name=$(jq -r .identityName.value <<< "$outputs")"
            echo "identity_client_id=$(jq -r .identityClientId.value <<< "$outputs")"
            echo "key_vault_name=$(jq -r .keyVaultName.value <<< "$outputs")"
            echo "devauth_secret_name=$(jq -r .devAuthSecretName.value <<< "$outputs")"
            echo "static_web_app_name=$(jq -r .staticWebAppName.value <<< "$outputs")"
            echo "static_web_app_host=$(jq -r .staticWebAppHostName.value <<< "$outputs")"
          } >> "$GITHUB_OUTPUT"

      - name: Read the dev sign-in access code
        id: access
        env:
          KEY_VAULT_NAME: ${{ steps.provision.outputs.key_vault_name }}
          SECRET_NAME: ${{ steps.provision.outputs.devauth_secret_name }}
        run: |
          for attempt in $(seq 1 10); do
            if code=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$SECRET_NAME" --query value -o tsv); then
              echo "::add-mask::$code"
              echo "code=$code" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          exit 1

      - name: Sign in to Azure again for the database token
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply migrations
        env:
          SQL_SERVER_FQDN: ${{ steps.provision.outputs.sql_server_fqdn }}
          DATABASE_NAME: ${{ steps.provision.outputs.database_name }}
        run: |
          chmod +x artifacts/database/efbundle
          connection="Server=tcp:${SQL_SERVER_FQDN},1433;Database=${DATABASE_NAME};Authentication=Active Directory Default;Encrypt=True;"
          for attempt in 1 2 3 4 5 6; do
            if artifacts/database/efbundle --connection "$connection"; then
              exit 0
            fi
            sleep 30
          done
          exit 1

      - name: Create the web app database user
        uses: azure/sql-action@eb1f9a80487ca52b90f41a473f53da4943526994
        with:
          connection-string: Server=tcp:${{ steps.provision.outputs.sql_server_fqdn }},1433;Initial Catalog=${{ steps.provision.outputs.database_name }};Authentication=Active Directory Default;Encrypt=True;
          path: infra/sql/grant-app-user.sql
          arguments: -v UserName="${{ steps.provision.outputs.identity_name }}" UserClientId="${{ steps.provision.outputs.identity_client_id }}"

      - name: Verify the web app database user
        uses: azure/sql-action@eb1f9a80487ca52b90f41a473f53da4943526994
        with:
          connection-string: Server=tcp:${{ steps.provision.outputs.sql_server_fqdn }},1433;Initial Catalog=${{ steps.provision.outputs.database_name }};Authentication=Active Directory Default;Encrypt=True;
          path: infra/sql/verify-app-user.sql
          arguments: -v UserName="${{ steps.provision.outputs.identity_name }}"

      - name: Deploy the API
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383
        with:
          app-name: ${{ steps.provision.outputs.web_app_name }}
          package: artifacts/api

      - name: Restart the web app
        env:
          WEB_APP_NAME: ${{ steps.provision.outputs.web_app_name }}
        run: az webapp restart --resource-group "$RESOURCE_GROUP" --name "$WEB_APP_NAME"

      - name: Smoke test
        env:
          WEB_APP_NAME: ${{ steps.provision.outputs.web_app_name }}
          WEB_APP_HOST: ${{ steps.provision.outputs.web_app_host }}
          ACCESS_CODE: ${{ steps.access.outputs.code }}
        run: |
          status=000
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://${WEB_APP_HOST}/health/ready" || true)
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 10
          done
          test "$status" = "200"

          curl -fsS -o /dev/null "https://${WEB_APP_HOST}/openapi/v1.json"

          user_id=$(az webapp config appsettings list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --query "[?name=='DevAuth__Users__0__Id'].value | [0]" \
            --output tsv)
          token=$(curl -fsS -X POST "https://${WEB_APP_HOST}/api/dev/token" \
            -H 'Content-Type: application/json' \
            -H "X-DevAuth-Secret: ${ACCESS_CODE}" \
            -d "{\"userId\":\"${user_id}\"}" | jq -r .token)
          test -n "$token"
          test "$token" != "null"

          curl -fsS -o /dev/null -H "Authorization: Bearer ${token}" "https://${WEB_APP_HOST}/api/claims"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend against the deployed API
        working-directory: frontend
        env:
          WEB_APP_HOST: ${{ steps.provision.outputs.web_app_host }}
        run: |
          sed -i "s#apiBaseUrl: '/api'#apiBaseUrl: 'https://${WEB_APP_HOST}/api'#" src/environments/environment.ts
          grep -q "https://${WEB_APP_HOST}/api" src/environments/environment.ts
          npm ci
          npm run build

      - name: Read the static web app deployment token
        id: swa
        env:
          STATIC_WEB_APP_NAME: ${{ steps.provision.outputs.static_web_app_name }}
        run: |
          token=$(az staticwebapp secrets list --name "$STATIC_WEB_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy the frontend
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/dist/claims-frontend/browser
          skip_app_build: true
          skip_api_build: true

      - name: Summary
        env:
          WEB_APP_HOST: ${{ steps.provision.outputs.web_app_host }}
          STATIC_WEB_APP_HOST: ${{ steps.provision.outputs.static_web_app_host }}
        run: |
          {
            echo "### Deployed"
            echo "- App: https://${STATIC_WEB_APP_HOST}"
            echo "- API: https://${WEB_APP_HOST}"
            echo "- Swagger: https://${WEB_APP_HOST}/swagger"
          } >> "$GITHUB_STEP_SUMMARY"
