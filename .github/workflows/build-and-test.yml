name: Build and Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci0nlyPassw0rd9X
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci0nlyPassw0rd9X -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      CLAIMS_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=Ci0nlyPassw0rd9X;TrustServerCertificate=True;Connect Timeout=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: backend/Directory.Packages.props

      - run: dotnet restore backend

      - run: dotnet build backend -c Release --no-restore

      - run: dotnet test backend -c Release --no-build

      - run: dotnet publish backend/src/ClaimsModule.API -c Release --no-build -o artifacts/api

      - run: dotnet tool restore
        working-directory: backend

      - run: >-
          dotnet dotnet-ef migrations bundle
          --project src/ClaimsModule.Persistence
          --configuration Release
          --no-build
          --self-contained
          --target-runtime linux-x64
          --output ../artifacts/database/efbundle
          --force
        working-directory: backend

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api
          path: artifacts/api
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: database
          path: artifacts/database
          if-no-files-found: error
          retention-days: 7
